<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shield Live Location</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#132436;color:#fff;min-height:100vh;}
  .header{background:#0b1620;padding:16px 20px;border-bottom:1px solid #1a2d3d;}
  .header h1{font-size:18px;font-weight:600;}
  .header p{font-size:12px;color:#8fa4b3;margin-top:4px;}
  .status-bar{display:flex;align-items:center;gap:8px;padding:10px 20px;background:#1a2d3d;font-size:12px;}
  .pulse{width:8px;height:8px;background:#3f7358;border-radius:50%;animation:pulse 1.5s infinite;}
  .pulse.offline{background:#a8412f;animation:none;}
  @keyframes pulse{0%{transform:scale(1);opacity:1;}100%{transform:scale(2.5);opacity:0;}}
  #map{height:calc(100vh - 140px);width:100%;background:#0d1b26;position:relative;overflow:hidden;}
  .map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:60px 60px;}
  .map-dot{position:absolute;width:20px;height:20px;background:#ff6b6b;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 6px rgba(255,107,107,0.2),0 0 30px rgba(255,107,107,0.4);transform:translate(-50%,-50%);transition:all 0.8s cubic-bezier(0.4,0,0.2,1);z-index:10;}
  .map-dot::after{content:'';position:absolute;top:50%;left:50%;width:40px;height:40px;border:2px solid rgba(255,107,107,0.3);border-radius:50%;transform:translate(-50%,-50%);animation:ripple 2s infinite;}
  @keyframes ripple{0%{transform:translate(-50%,-50%) scale(1);opacity:1;}100%{transform:translate(-50%,-50%) scale(2);opacity:0;}}
  .map-trail{position:absolute;inset:0;z-index:5;}
  .map-trail svg{width:100%;height:100%;}
  .accuracy-ring{position:absolute;border:2px dashed rgba(255,107,107,0.15);border-radius:50%;transform:translate(-50%,-50%);transition:all 0.8s ease;pointer-events:none;}
  .info-panel{position:absolute;bottom:0;left:0;right:0;background:rgba(11,22,32,0.95);backdrop-filter:blur(10px);padding:16px 20px;border-top:1px solid #1a2d3d;z-index:20;}
  .info-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .info-row:last-child{margin-bottom:0;}
  .info-label{font-size:11px;color:#8fa4b3;text-transform:uppercase;letter-spacing:0.5px;}
  .info-value{font-size:14px;font-weight:600;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;color:#fff;}
  .btn-primary{background:#3f7358;}
  .btn-danger{background:#a8412f;}
  .actions{display:flex;gap:10px;margin-top:12px;}
  .expired{text-align:center;padding:40px 20px;}
  .expired h2{color:#a8412f;font-size:24px;margin-bottom:8px;}
  .expired p{color:#8fa4b3;font-size:14px;}
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);background:#fff;color:#132436;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.3);transition:transform 0.3s ease;z-index:100;}
  .toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/shared-map.js"></script>
</body>
</html>
